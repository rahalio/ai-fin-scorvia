openapi: 3.1.0
info:
  title: Scorvia Evaluations API
  version: 0.1.0
  description: Imbalance-aware evaluation, regime tests, bias checks, and interpretability packs.
  x-domain: evl
  x-domain-prefix: EVL
  license:
    name: Proprietary
    url: https://scorvia.local/license
servers:
  - url: https://api.scorvia.local
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Evaluations
  - name: Interpretability
paths:
  /v1/candidates/{candidateId}/evaluations:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: runEvaluation
      summary: Run Evaluation
      tags: [Evaluations]
      x-repository: EvaluationReport
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./evaluations.schemas.yaml#/components/schemas/EvaluationCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./evaluations.schemas.yaml#/components/schemas/EvaluationReportResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    get:
      operationId: listEvaluations
      summary: List Evaluations
      tags: [Evaluations]
      x-repository: EvaluationReport
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./evaluations.schemas.yaml#/components/schemas/EvaluationReportListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/evaluations/{evaluationId}:
    parameters:
      - name: evaluationId
        in: path
        required: true
        schema:
          $ref: ./evaluations.schemas.yaml#/components/schemas/EvaluationReportId
    get:
      operationId: getEvaluation
      summary: Get Evaluation
      tags: [Evaluations]
      x-repository: EvaluationReport
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./evaluations.schemas.yaml#/components/schemas/EvaluationReportResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/candidates/{candidateId}/interpretability-packs:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: attachInterpretabilityPack
      summary: Attach Interpretability Pack
      tags: [Interpretability]
      x-repository: InterpretabilityPack
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./evaluations.schemas.yaml#/components/schemas/InterpretabilityPackCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./evaluations.schemas.yaml#/components/schemas/InterpretabilityPackResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
