openapi: 3.1.0
info:
  title: Scorvia Policy API
  version: 0.1.0
  description: PD band policy maps — grant/refer/deny owned by credit policy.
  x-domain: pol
  x-domain-prefix: POL
  license:
    name: Proprietary
    url: https://scorvia.local/license
servers:
  - url: https://api.scorvia.local
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Policy
paths:
  /v1/policy-maps:
    get:
      operationId: listPolicyMaps
      summary: List Policy Maps
      tags: [Policy]
      x-repository: PolicyMap
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./policy.schemas.yaml#/components/schemas/PolicyMapListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createPolicyMap
      summary: Create Policy Map
      tags: [Policy]
      x-repository: PolicyMap
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./policy.schemas.yaml#/components/schemas/PolicyMapCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./policy.schemas.yaml#/components/schemas/PolicyMapResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/policy-maps/{policyMapId}:
    parameters:
      - name: policyMapId
        in: path
        required: true
        schema:
          $ref: ./policy.schemas.yaml#/components/schemas/PolicyMapId
    get:
      operationId: getPolicyMap
      summary: Get Policy Map
      tags: [Policy]
      x-repository: PolicyMap
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./policy.schemas.yaml#/components/schemas/PolicyMapResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/policy-maps/{policyMapId}/publish:
    parameters:
      - name: policyMapId
        in: path
        required: true
        schema:
          $ref: ./policy.schemas.yaml#/components/schemas/PolicyMapId
    post:
      operationId: publishPolicyMap
      summary: Publish Policy Map
      tags: [Policy]
      x-repository: PolicyMap
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: ./policy.schemas.yaml#/components/schemas/PolicyMapResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/policy-maps/{policyMapId}/simulate:
    parameters:
      - name: policyMapId
        in: path
        required: true
        schema:
          $ref: ./policy.schemas.yaml#/components/schemas/PolicyMapId
    post:
      operationId: simulatePolicyMap
      summary: Simulate Policy Map
      tags: [Policy]
      x-repository: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./policy.schemas.yaml#/components/schemas/PolicySimulateRequest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./policy.schemas.yaml#/components/schemas/PolicySimulateResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
